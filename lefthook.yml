# Git hooks configuration for pdf2md-tui
# Install: make hooks-install OR lefthook install
# This ensures all commits pass linting, formatting, and vet checks

pre-commit:
  parallel: true
  jobs:
    - name: gofmt
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true

    - name: golangci-lint
      glob: "*.go"
      run: |
        if ! command -v golangci-lint &> /dev/null; then
          echo "ERROR: golangci-lint not found. Install with: brew install golangci-lint"
          echo "   Or: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest"
          exit 1
        fi
        golangci-lint run ./...

    - name: go-vet
      glob: "*.go"
      run: go vet ./...

pre-push:
  parallel: true
  jobs:
    - name: golangci-lint
      run: golangci-lint run ./...

    - name: go-test-race
      run: go test -race ./...

    - name: go-build
      run: go build ./cmd/pdf2md-tui
