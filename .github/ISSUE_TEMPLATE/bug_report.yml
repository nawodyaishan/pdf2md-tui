name: Bug Report
description: Something isn't working as expected
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: input
    id: version
    attributes:
      label: pdf2md-tui version
      description: Output of `pdf2md-tui version`
      placeholder: "v0.1.0 commit: abc1234 built: 2026-05-06T00:00:00Z"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (arm64)
        - macOS (amd64)
        - Linux (amd64)
        - Linux (arm64)
        - Windows (amd64)
        - Other
    validations:
      required: true

  - type: input
    id: go_version
    attributes:
      label: Go version (if built from source)
      placeholder: "go1.22.3"

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the exact command you ran and, if possible, a minimal PDF that triggers the issue.
      placeholder: |
        1. Run `pdf2md-tui convert ./sample-dir --strip-noise`
        2. Observe ...
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Full command output
      description: Paste the complete terminal output (include `--verbose` output if relevant).
      render: shell

  - type: textarea
    id: pdf_info
    attributes:
      label: PDF details (if relevant)
      description: |
        Page count, whether the PDF is scanned/image-only, source application (e.g., "exported from Adobe Acrobat"), file size.
      placeholder: "50 pages, text-based, exported from Word, ~2 MB"

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I am using the latest release
          required: false
