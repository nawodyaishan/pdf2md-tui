name: CI

on:
  push:
    branches: [ main, dev, staging ]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Check coverage threshold (70%)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go tool cover -func=coverage.out | awk '/total:/{cov=$3+0; if(cov<70){printf "FAIL: Coverage %.1f%% < 70%% threshold\n",cov; exit 1} else {printf "OK: Coverage %.1f%%\n",cov}}'
      - name: Run fuzz tests (30s)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test -fuzz=FuzzCoalesceChars -fuzztime=30s ./pkg/repository/pdf/
          go test -fuzz=FuzzApplyLLMOptimizations -fuzztime=30s ./pkg/service/
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build verification
    needs: [ lint, test ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binary
        run: go build -o ./bin/pdf2md-tui ./cmd/pdf2md-tui
      - name: Smoke test
        run: ./bin/pdf2md-tui version

  benchmarks:
    name: Benchmark regression detection
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run benchmarks (current PR)
        run: go test -bench=. -benchmem -count=5 ./pkg/... | tee bench_pr.txt
      - name: Checkout main branch
        run: git fetch origin main && git checkout origin/main
      - name: Run benchmarks (main baseline)
        run: go test -bench=. -benchmem -count=5 ./pkg/... | tee bench_main.txt
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest
      - name: Compare benchmarks
        run: benchstat bench_main.txt bench_pr.txt
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            bench_pr.txt
            bench_main.txt
        if: always()
